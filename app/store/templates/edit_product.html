{% extends "base.html" %}

{% block title %}Editar Producto{% endblock %}

{% block head %}{{ super() }}<link rel="stylesheet" href="{{ url_for('store_bp.static', filename='css/store.css') }}?v=20261018-edit-volver">{% endblock %}
{% block content %}
<div class="store-dark maxw-800 mx-auto br-8 edit-product-card">
  <div class="edit-product-header">
    <h2 class="m-0">Editar Producto</h2>
  </div>
  <form action="" method="POST" class="d-flex flex-column gap-05 edit-product-form" id="editProductForm">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label for="editProductName" class="sr-only">Nombre</label>
    <input type="text" name="name" value="{{ product.name }}" required class="edit-product-input" id="editProductName" {% if product.is_preset %}readonly{% endif %} autocomplete="off">
    <div class="edit-product-prices">
      <label for="editProductPriceCop" class="edit-product-price-label">Precio COP</label>
      <input type="number" step="1" name="price_cop" value="{{ product.price_cop|money_amount }}" required class="edit-product-input" id="editProductPriceCop" autocomplete="off">
      <label for="editProductPriceUsd" class="edit-product-price-label">Precio USD</label>
      <input type="number" step="0.01" min="0" name="price_usd" value="{{ product.price_usd|money_amount }}" required class="edit-product-input" id="editProductPriceUsd" autocomplete="off">
    </div>
    <div class="image-select-container edit-product-image-container">
      <div class="grid-overlay" id="imageGridOverlay"></div>
      <label for="imageSelect" class="sr-only">Seleccionar imagen</label>
      <select name="image_filename" id="imageSelect" class="visually-hidden-select edit-product-image-select" autocomplete="off">
        <option value="none" {% if product.image_filename == 'none' %}selected{% endif %}>Ninguno</option>
        {% for img_name in stream_icon_files %}
          <option value="{{ img_name }}" {% if product.image_filename == img_name %}selected{% endif %}>{{ img_name }}</option>
        {% endfor %}
      </select>
      <button type="button" id="imageSelectTrigger" class="image-select-trigger-btn edit-product-image-select">Seleccionar Imagen</button>
      <div class="image-grid" id="imageGrid"></div>
    </div>
    <div class="mt-05 edit-product-preview-container">
      <img id="imgPreview" src="{{ url_for('static', filename='images/' + (product.image_filename if product.image_filename and product.image_filename != 'none' else 'stream1.png')) }}" alt="Preview" class="edit-product-preview-img">
    </div>
    <label for="description" class="sr-only">Descripción del producto</label>
    <textarea name="description" id="description" class="textarea-black-border" placeholder="Descripción del producto (opcional)" autocomplete="off">{{ product.description or '' }}</textarea>
    <div class="edit-product-save-row">
      <label class="edit-product-visible" for="editProductEnabled">Visible
        <input type="checkbox" id="editProductEnabled" name="enabled" {% if product.enabled %}checked{% endif %} autocomplete="off">
      </label>
      <div class="edit-product-save-actions">
        <a href="{{ url_for('store_bp.admin_productos') }}" class="btn-panel btn-blue edit-product-back">Volver</a>
        <button type="submit" class="btn-panel btn-green">Guardar</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
{% block scripts %}{{ super() }}<script src="{{ url_for('store_bp.static', filename='js/admin_store.js') }}?v=20261027-stream-icons" defer></script>{% endblock %}
