{% extends "base.html" %}

{% block title %}{{ html.title }}{% endblock %}

{% block head %}
  {{ super() }}
  <link rel="stylesheet" href="{{ url_for('store_bp.static', filename='css/store.css') }}?v=20261022-tv-fullwidth">
{% endblock %}

{% block content %}
<div class="container store-light public-tools-container public-tools-wide mx-auto br-8">
  <h2 class="text-center mt-2 mb-3">{{ html.title }}</h2>
  <div class="card herramienta-accordion tool-public-one-card">
    <div class="accordion-body">
      {{ html | html_info_body | rewrite_external_images | safe }}
    </div>
  </div>
</div>
{% endblock %}
