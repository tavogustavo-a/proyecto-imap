{% set sec = section if section is defined and section else none %}
<div class="mdp-section-edit" data-ct-section>
  <div class="mdp-title-row ct-title-edit">
    {% with mdp_icon_current=(sec.icon if sec and sec.icon else ''), mdp_icon_name='ct_icon', mdp_icon_choices=como_trabajo_icons %}
      {% include 'includes/medios_pago_main_icon_picker.html' %}
    {% endwith %}
    <label class="sr-only" data-ct-label="title">Título</label>
    <input type="text" name="ct_title" class="form-control" data-ct-field="title" placeholder="Título" value="{{ sec.title if sec else '' }}" autocomplete="off" maxlength="160">
    <label class="sr-only" data-ct-label="color">Color del título</label>
    <input type="color" name="ct_color" data-ct-field="color" value="{{ sec.color if sec else '#1e88e5' }}">
  </div>
  <label class="sr-only" data-ct-label="subtitles">Subtítulos</label>
  <textarea name="ct_subtitles" class="form-control" data-ct-field="subtitles" rows="3" placeholder="Subtítulos, uno por línea (opcional)" autocomplete="off">{% if sec %}{{ sec.subtitles | join('\n') }}{% endif %}</textarea>
  <label class="sr-only" data-ct-label="description">Descripción</label>
  <textarea name="ct_description" class="form-control" data-ct-field="description" rows="2" placeholder="Descripción (opcional)" autocomplete="off">{% if sec %}{{ sec.description }}{% endif %}</textarea>
  <div class="mdp-url-row ct-remove-row">
    <button type="button" class="mdp-remove-x" data-ct-remove aria-label="Eliminar título" title="Eliminar título">&times;</button>
  </div>
</div>
