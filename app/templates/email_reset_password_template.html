<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <style>
        .email-body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 40px 0;
        }
        .email-wrapper {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #e1e1e1;
        }
        .email-header {
            background-color: #007bff;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
        .email-header h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
        }
        .email-content {
            padding: 30px;
            color: #444444;
            line-height: 1.6;
        }
        .reset-action {
            text-align: center;
            margin: 22px 0 20px;
        }
        .reset-button {
            display: inline-block;
            background-color: #007bff;
            color: #ffffff !important;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            padding: 14px 32px;
            border-radius: 6px;
        }
        .reset-link-fallback {
            font-size: 13px;
            color: #666666;
            word-break: break-all;
        }
        .reset-link-fallback a {
            color: #007bff;
        }
        .email-footer {
            padding: 20px;
            background-color: #f1f1f1;
            color: #888888;
            font-size: 12px;
            text-align: center;
        }
        .mt-2 {
            margin-top: 20px;
        }
            <p>Hola, Has solicitado restablecer la contraseña de tu cuenta.</p>
            <p>Pulsa el botón para elegir una contraseña nueva. El enlace caduca al usarse o tras un tiempo por seguridad.</p>

            <div class="reset-action">
                <a href="{{ reset_link }}" class="reset-button">Restablecer contraseña</a>
            </div>
            <div class="reset-action">
                <a href="{{ reset_link }}" class="reset-button">Restablecer contraseña</a>
            </div>

            <p class="reset-link-fallback">
                Si el botón no funciona, copia y pega este enlace en tu navegador:<br>
                <a href="{{ reset_link }}">{{ reset_link }}</a>
            </p>

            <p class="mt-2">Si no has sido tú, ignora este correo; tu contraseña no cambiará.</p>
        </div>
        <div class="email-footer">
            <p>Este es un correo automático, por favor no respondas a este mensaje.</p>
            <p>&copy; 2026 Tu Premium. Todos los derechos reservados.</p>
        </div>
    </div>
</body>
</html>
