<!-- app/templates/edit_regex.html -->
{% extends "base.html" %}

{% block title %}Editar Regex{% endblock %}

{% block content %}
<div class="admin-card form-container-medium admin-edit-regex-filter-page">
  <h2 class="m-0 mb-1 text-center w-100">Editar Regex</h2>

  <form method="POST">
    <!-- Campo oculto para el CSRF Token (SeaSurf) -->
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

    <label for="editRegexSender">Remitente (Sender) (opcional):</label>
    <input
      type="text"
      id="editRegexSender"
      name="sender"
      value="{{ regex.sender or '' }}"
      placeholder="Varios correos separados por coma: correo1, correo2"
      class="d-block edit-regex-filter-field"
      autocomplete="off"
    >

    <label for="editRegexPattern">Expresión Regular (Pattern):</label>
    <!-- Aquí quitamos maxlength para permitir regex más largos -->
    <input
      type="text"
      id="editRegexPattern"
      name="pattern"
      value="{{ regex.pattern }}"
      class="d-block edit-regex-filter-field"
      size="30" 
      required
      autocomplete="off"
    >

    <label for="editRegexDescription">Descripción (obligatorio):</label>
    <input
      type="text"
      id="editRegexDescription"
      name="description"
      value="{{ regex.description }}"
      class="d-block edit-regex-filter-field"
      required
      autocomplete="off"
    >

    <div class="edit-regex-filter-footer-actions">
      <label for="editRegexEnabled">¿Habilitado?</label>
      <input type="checkbox" id="editRegexEnabled" name="enabled" {% if regex.enabled %}checked{% endif %}>
      <button type="submit" class="btn-green">Guardar</button>
      <button
        type="button"
        id="btnVolverRegex"
        class="btn-blue"
        data-url="{{ url_for('admin_bp.regex_page') }}"
      >
        Volver
      </button>
    </div>
  </form>
</div>
{% endblock %}
