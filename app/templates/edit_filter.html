<!-- app/templates/edit_filter.html -->
{% extends "base.html" %}

{% block title %}Editar Filtro{% endblock %}

{% block content %}
<div class="admin-card form-container-medium admin-edit-regex-filter-page">
  <h2 class="m-0 mb-1 text-center w-100">Editar Filtro</h2>
  
  <form method="POST">
    <!-- Campo oculto para el CSRF Token (SeaSurf) -->
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

    <div class="form-group">
      <label for="editFilterSender">Remitente (Sender):</label>
      <input type="text" id="editFilterSender" name="sender" value="{{ filter.sender or '' }}" placeholder="Varios correos separados por coma: correo1, correo2" class="edit-regex-filter-field" autocomplete="off">
    </div>

    <div class="form-group">
      <label for="editFilterKeyword">Clave (Keyword):</label>
      <input type="text" id="editFilterKeyword" name="keyword" value="{{ filter.keyword }}" class="edit-regex-filter-field" autocomplete="off">
    </div>

    <!-- Campo para "cortar HTML desde arriba" -->
    <div class="form-group">
      <label for="editFilterCutHtml">Cortar DESDE ARRIBA (opcional):</label>
      <input
        type="text"
        id="editFilterCutHtml"
        name="cut_after_html"
        value="{{ filter.cut_after_html if filter.cut_after_html else '' }}"
        class="edit-regex-filter-field"
        autocomplete="off"
      >
    </div>

    <!-- Campo para "cortar HTML desde abajo" -->
    <div class="form-group">
      <label for="editFilterCutHtmlBefore">Cortar DESDE ABAJO (opcional):</label>
      <input
        type="text"
        id="editFilterCutHtmlBefore"
        name="cut_before_html"
        value="{{ filter.cut_before_html if filter.cut_before_html else '' }}"
        class="edit-regex-filter-field"
        autocomplete="off"
      >
    </div>

    <div class="form-group">
      <label for="editFilterDescription">Descripción (obligatorio):</label>
      <input
        type="text"
        id="editFilterDescription"
        name="description"
        value="{{ filter.description if filter.description else '' }}"
        class="edit-regex-filter-field"
        required
        autocomplete="off"
      >
    </div>

    <div class="edit-regex-filter-footer-actions">
      <label for="editFilterEnabled">¿Habilitado?</label>
      <input type="checkbox" name="enabled" id="editFilterEnabled" {% if filter.enabled %}checked{% endif %}>
      <button type="submit" class="btn-green">Guardar</button>
      <button
        type="button"
        id="btnVolverFilters"
        class="btn-blue"
        data-url="{{ url_for('admin_bp.filters_page') }}"
      >
        Volver
      </button>
    </div>
  </form>
</div>
{% endblock %}
