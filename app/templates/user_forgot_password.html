{% extends "base.html" %}
{% block content %}
<div class="card form-container-medium mt-2 mb-2 text-center">
  <h2 class="text-center">Recuperar Contraseña</h2>
  <p class="text-center">El enlace llega al correo que está guardado en tu cuenta.</p>

  <form method="POST" action="{{ url_for('user_auth_bp.forgot_password') }}" class="d-flex flex-column align-items-center gap-1">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

    <div class="mb-1 d-flex flex-column align-items-center w-100 otp-input-container">
      <label for="user_input">Usuario o correo:</label>
      {{ form.user_input(size=40, class="w-100", autocomplete="username") }}
    </div>

    <div class="d-flex align-items-center justify-content-center gap-1">
      <button type="submit" class="btn btn-red">Recuperar Contraseña</button>
      <button
        type="button"
        class="btn-blue"
        data-url="{{ url_for('user_auth_bp.login') }}"
      >
        Volver
      </button>
    </div>
  </form>
</div>
{% endblock %}
